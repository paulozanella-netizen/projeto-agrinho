<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroEquilíbrio 2050</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <header>
            <h1>AgroEquilíbrio 2050</h1>
            <div class="status">
                <span>Nível: <strong id="level-display">1</strong></span>
                <span>Pontos: <strong id="score-display">0</strong></span>
            </div>
        </header>

        <main class="card">
            <h2 id="level-title">Nível 1 (O Despertar)</h2>
            <p id="level-desc">Gestão de uma pequena fazenda familiar. O desafio é sobreviver à primeira grande seca.</p>
            
            <hr>

            <div class="oracle-box">
                <h3>🔮 O Oráculo do Agro</h3>
                <p id="question-text">Carregando desafio técnico...</p>
                
                <div id="options-container" class="options-grid">
                    </div>
            </div>

            <div id="feedback" class="hidden"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
